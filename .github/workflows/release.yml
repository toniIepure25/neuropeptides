name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install build cyclonedx-bom
      - name: Check release metadata
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Build sdist and wheel
        env:
          SOURCE_DATE_EPOCH: "1794680589"
        run: python -m build
      - name: Normalize sdist timestamps
        run: python scripts/normalize_sdist.py dist/*.tar.gz --epoch 1794680589
      - name: Generate CycloneDX SBOM
        env:
          SOURCE_DATE_EPOCH: "1794680589"
        run: |
          python -m venv /tmp/ntx-sbom
          /tmp/ntx-sbom/bin/python -m pip install --no-index --no-deps --quiet dist/*.whl
          /tmp/ntx-sbom/bin/python -m pip uninstall -y pip >/dev/null
          python -m cyclonedx_py environment /tmp/ntx-sbom \
            --pyproject "$PWD/pyproject.toml" \
            --mc-type application \
            --output-reproducible \
            --of JSON \
            -o "dist/ntx-${GITHUB_REF_NAME#v}.sbom.json"
      - name: Validate SBOM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(next(Path("dist").glob("*.sbom.json")).read_text())
          assert payload["bomFormat"] == "CycloneDX"
          assert payload["specVersion"]
          assert payload["metadata"]["component"]["name"] == "ntx"
          print("sbom:", payload["specVersion"], len(payload.get("components", [])), "dependencies")
          PY
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.sbom.json > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Verify attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/*.whl --repo "$GITHUB_REPOSITORY"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS \
            --verify-tag \
            --title "ntx $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
