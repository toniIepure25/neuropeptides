[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ntx"
dynamic = ["version"]
description = "Provenance-first surveillance and hypothesis triage for neuropeptide and neurotrophic claims"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iepure Antoniu" }]
keywords = ["neuropeptides", "neurotrophins", "literature-mining", "provenance", "evidence-synthesis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
  "mypy>=2.4.1",
  "build>=1.6.1",
  "pre-commit>=4.7.0",
]

[project.scripts]
ntx = "ntx.cli:main"

[project.urls]
Homepage = "https://github.com/toniIepure25/neuropeptides#readme"
Documentation = "https://github.com/toniIepure25/neuropeptides/tree/main/docs"
Repository = "https://github.com/toniIepure25/neuropeptides"
Issues = "https://github.com/toniIepure25/neuropeptides/issues"
Changelog = "https://github.com/toniIepure25/neuropeptides/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ntx.__version__" }

[tool.setuptools.package-data]
ntx = ["data/*.json", "data/*.md", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE"]
ignore = ["E501", "SIM108", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/ntx"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ntx"]
branch = true
omit = ["src/ntx/data/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
