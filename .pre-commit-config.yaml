repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy src/ntx
        language: system
        pass_filenames: false
      - id: release-metadata
        name: release metadata
        entry: python scripts/check_release.py
        language: system
        pass_filenames: false
